<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" /> <!-- Indigo-600 -->
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" /> <!-- Cyan-500 -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="5" dy="5" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle (Optional, for app icon feel) -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#grad1)" filter="url(#shadow)" opacity="0.1"/>

  <!-- D Shape -->
  <path d="M140 100 V412 H260 C360 412 400 350 400 256 C400 162 360 100 260 100 H140 Z M200 160 H260 C310 160 340 200 340 256 C340 312 310 352 260 352 H200 V160 Z" fill="url(#grad1)"/>

  <!-- C / Chart Shape overlaying or cutout -->
  <!-- Let's integrate a chart bar into the negative space of D or alongside it. 
       Actually, let's overlap a stylized C that looks like a gauge or chart. 
       Simpler approach: A "DC" monogram where the C is a growing chart.
  -->
  
  <!-- Redoing for clearer monogram + chart concept -->
  <!-- Background cleared for transparency optimization -->
  
  <g filter="url(#shadow)">
      <!-- Main Monogram 'DC' -->
      <!-- 'D' part -->
      <path d="M80 80 H220 C320 80 370 150 370 256 C370 362 320 432 220 432 H80 V80 Z M150 150 V362 H220 C280 362 300 320 300 256 C300 192 280 150 220 150 H150 Z" fill="url(#grad1)"/>
      
      <!-- 'C' integrated with rising bars inside -->
      <!-- We can place bars ascending inside the counter of the D to signify analytics -->
      <rect x="170" y="300" width="30" height="40" rx="4" fill="#06B6D4"/>
      <rect x="210" y="260" width="30" height="80" rx="4" fill="#06B6D4"/>
      <rect x="250" y="220" width="30" height="120" rx="4" fill="#4F46E5"/>
  </g>
</svg>
